<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Daniel Park — Art Director & Graphic Designer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: #ffad00;
      color: #191919;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hero {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-content {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(64px, 10vw, 150px);
      line-height: 0.85;
      font-weight: 900;
    }

    p {
      margin-top: 25px;
      font-size: 24px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <main class="hero">
    <div class="hero-content">
      <h1>DANIEL<br>PARK</h1>
      <p>ART DIRECTOR & GRAPHIC DESIGNER</p>
    </div>
  </main>

</body>
</html>
