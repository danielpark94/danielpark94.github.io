<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#191919">
  <meta name="description" content="Get in touch with Daniel Park for projects, collaborations, and creative inquiries.">
  <title>Contact — Daniel Park</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body class="contact-page">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Daniel Park Hero Studio home"><img src="assets/logo/daniel-park-logo.svg" alt="Daniel Park Hero Studio"></a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu"><span></span><span></span><span></span><b>Menu</b></button>
    <nav class="site-nav" id="site-nav" aria-label="Main navigation"><a href="work.html">Work</a><a href="about.html">About</a><a class="is-current" href="contact.html" aria-current="page">Contact</a></nav>
  </header>
  <main class="contact-main">
    <section class="contact-hero section-wrap" aria-labelledby="contact-title">
      <img class="contact-logo" src="assets/logo/daniel-park-logo.svg" alt="Daniel Park Hero Studio">
      <div class="contact-content">
        <h1 id="contact-title">Don’t be shy,<br>reach out for more info!</h1>
        <form class="contact-form" id="contact-form">
          <div class="contact-fields">
            <label>First and last name<input name="Name" type="text" autocomplete="name" required></label>
            <label>Role or company<input name="Role or company" type="text" autocomplete="organization-title"></label>
            <label>Reason for reaching out<select name="Reason" required><option value="" disabled selected>Select a reason</option><option>Project inquiry</option><option>Collaboration</option><option>Employment opportunity</option><option>Other</option></select></label>
            <label class="contact-message">Message<textarea name="Message" rows="5" required></textarea></label>
          </div>
          <div class="contact-actions"><button class="contact-submit" type="submit">Send a message <span aria-hidden="true">↗</span></button><a class="whatsapp-link" href="https://wa.me/593968604235" target="_blank" rel="noopener noreferrer"><span class="whatsapp-mark" aria-hidden="true">◔</span> Chat on WhatsApp</a></div>
          <p class="contact-note" id="contact-note" aria-live="polite">Your email app will open with your message ready to send.</p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="contact">
    <div class="footer-inner section-wrap">
      <div class="footer-message"><h2>Let’s Work<br>Together.</h2><p class="footer-script">Have a project in mind?</p><p class="footer-tagline">Let’s make something worth looking at.</p></div>
      <div class="footer-contact"><a class="email-link" href="mailto:work.danielpark@gmail.com"><img src="assets/icons/mail.svg" alt=""><span>work.danielpark@gmail.com</span></a><div class="social-links" aria-label="Social links"><a href="https://www.behance.net/danielpark94" target="_blank" rel="noopener noreferrer" aria-label="Behance"><img src="assets/icons/behance.svg" alt=""></a><a href="https://linkedin.com/in/daniel-s-park-b25a4086" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><img src="assets/icons/linkedin.svg" alt=""></a><a href="https://instagram.com/danielpark94" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><img src="assets/icons/instagram.svg" alt=""></a></div><p class="copyright">2026 Daniel Park&nbsp; | &nbsp;Guayaquil, Ecuador</p></div>
    </div>
  </footer>
</body>
</html>
